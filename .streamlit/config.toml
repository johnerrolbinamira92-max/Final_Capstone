[theme]
base = "light"
primaryColor = "#007C89"
backgroundColor = "#F3F6FB"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#17263D"
borderColor = "#DCE5EF"
dataframeBorderColor = "#DCE5EF"
dataframeHeaderBackgroundColor = "#E8EFF7"
dataframeHeaderTextColor = "#243853"
showWidgetBorder = true
showSidebarBorder = true
baseRadius = "medium"
buttonRadius = "medium"
font = "sans-serif"
headingFont = "sans-serif"
headingFontSizes = ["2.25rem", "1.75rem", "1.5rem", "1.25rem", "1rem", "0.9rem"]
headingFontWeights = [700, 650, 600, 600, 600, 600]
chartCategoricalColors = ["#007C89", "#3671C8", "#D08A2D", "#54855F", "#8257A6", "#C45D58"]

[theme.sidebar]
backgroundColor = "#081B38"
secondaryBackgroundColor = "#102849"
textColor = "#EEF4FC"
primaryColor = "#007C89"
borderColor = "#183454"
