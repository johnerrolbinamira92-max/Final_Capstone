[theme]
base = "dark"
primaryColor = "#367A75"
backgroundColor = "#102321"
secondaryBackgroundColor = "#183330"
textColor = "#F5F1E7"
borderColor = "#31534F"
dataframeBorderColor = "#31534F"
dataframeHeaderBackgroundColor = "#21423E"
dataframeHeaderTextColor = "#F5F1E7"
showWidgetBorder = true
showSidebarBorder = true
baseRadius = "large"
buttonRadius = "full"
font = "Roboto:https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&display=swap"
headingFont = "Roboto:https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&display=swap"
headingFontSizes = ["2.75rem", "2.125rem", "1.75rem", "1.375rem", "1.125rem", "1rem"]
headingFontWeights = [500, 500, 500, 600, 600, 600]
baseFontSize = 15
baseFontWeight = 400
linkColor = "#83B9B0"
linkUnderline = false
chartCategoricalColors = ["#367A75", "#83B9B0", "#E58B7D", "#C9C17B", "#70968C", "#A9C7C1"]

[theme.sidebar]
backgroundColor = "#0C1D1B"
secondaryBackgroundColor = "#183330"
textColor = "#F5F1E7"
primaryColor = "#367A75"
borderColor = "#31534F"
